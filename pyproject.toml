[project]
name = "simple-weather-waveshare"
version = "0.1.0"
description = "Simple Clock for the 7.5\"v2 Waveshare Display"
readme = "README.md"
authors = [
    { name = "SirRGB", email = "sirrgb@proton.me" }
]
requires-python = ">=3.12"
dependencies = [
    "attrs==26.1.0",
    "cattrs==26.1.0",
    "certifi==2026.7.22",
    "charset-normalizer==3.4.9",
    "colorzero==2.0",
    "flatbuffers==25.9.23",
    "h11==0.16.0",
    "idna==3.18",
    "jh2==5.0.13",
    "niquests==3.21.0",
    "openmeteo-requests==1.7.5",
    "openmeteo-sdk==1.28.0",
    "pillow==12.3.0",
    "platformdirs==4.11.0",
    "python-dateutil==2.9.0.post0",
    "pytz==2026.3.post1",
    "qh3==1.9.4",
    "requests==2.34.2",
    "requests-cache==1.3.3",
    "retry-requests==2.0.0",
    "setuptools==83.0.0",
    "six==1.17.0",
    "spidev==3.8",
    "typing-extensions==4.16.0",
    "tzdata==2026.3",
    "url-normalize==3.0.0",
    "urllib3==2.7.0",
    "urllib3-future==2.24.900",
    "wassima==2.1.3",
]

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
pi = [
    "gpiozero==2.0.1",
    "lgpio==0.2.2.0",
    "pigpio==1.78",
]
